# Experiment 1 overrides
experiment:
  id: "TaskMoE-multi-q-wopretrain-ablation"
  seed: 42
  # eval_first: true
  use_neptune: false            # Set to true and configure neptune_project if using Neptune.ai
  neptune_project: null         # e.g., "your-workspace/your-project"
  tags: ["moe_coef_0.8", "TaskMoE-multi", "w/o SCALEVLN",  "w/o pretrain", "Attn_q"]

training:
  batch_size: 8
  val_batch_size: 16
  workers: 4

model:
  moe_position: "Attn_q"
  pretrained_ckpt: null         # For LXMERT pretraining, download and specify path
  task_routing_feature: "multi"

task:
  source:                      # Source datasets for training
    ['R2R', 'REVERIE', 'OBJNAV_MP3D']
  val_source:                  # Source datasets for testing
    ['R2R', 'REVERIE', 'OBJNAV_MP3D']
  ratio:                       # Training ratio of each dataset
    [1, 1, 1]
  train_simulation_env: {      # Training simulator, choose from mattersim, habitat
    "R2R": "mattersim",
    "REVERIE": "mattersim",
    "OBJNAV_MP3D": "mp3d_habitat"
  }